<!DOCTYPE html>
<html>

<head>

<title>Amex MRCC Tracker</title>

<style>

body{
font-family:Arial;
padding:40px;
max-width:600px;
margin:auto;
}

input,select{
padding:8px;
margin:6px 0;
width:100%;
}

button{
padding:10px;
width:100%;
background:#2c7be5;
color:white;
border:none;
}

.card{
margin-top:20px;
padding:15px;
border:1px solid #ddd;
border-radius:6px;
}

.result{
font-size:18px;
font-weight:bold;
}

</style>

</head>

<body>

<h2>Amex MRCC Spend Tracker</h2>

<div class="card">

Month

<select id="month">
<option>Jan</option>
<option>Feb</option>
<option>Mar</option>
<option>Apr</option>
<option>May</option>
<option>Jun</option>
<option>Jul</option>
<option>Aug</option>
<option>Sep</option>
<option>Oct</option>
<option>Nov</option>
<option>Dec</option>
</select>

Month Type

<select id="type">
<option value="1500x4">1500 × 4</option>
<option value="20K">20K Month</option>
</select>

Spend Amount

<input id="amount" type="number" placeholder="Enter spend">

<button onclick="saveSpend()">Save Spend</button>

</div>

<div class="card result" id="result">
Loading data...
</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzNFOCvpmagXsEAXMHwdEE1uW4XJFJRKeYoIQF2h7QvBbT9sncEpXDaWe_S51z9tY0Sig/exec";

let spends=[];
let allSpends=[];

async function loadSpends(){

let res=await fetch(API);

let data=await res.json();

spends=[];
allSpends=[];

let selectedMonth=document.getElementById("month").value;

data.forEach(row=>{

let amt=Number(row.amount);

allSpends.push(amt);

if(row.month===selectedMonth){

spends.push(amt);

}

});

calculate();

}

function calculate(){

let type=document.getElementById("type").value;

let total=spends.reduce((a,b)=>a+b,0);

let count1500=spends.filter(x=>x>=1500).length;

let remainingTxn=Math.max(0,4-count1500);

let remainingSpend=Math.max(0,20000-total);

let annualTotal=allSpends.reduce((a,b)=>a+b,0);

let remainingAnnual=Math.max(0,150000-annualTotal);

let msg="";

if(type==="1500x4"){

msg+="Remaining ≥1500 transactions: "+remainingTxn;

}

if(type==="20K"){

msg+="Remaining ≥1500 transactions: "+remainingTxn;

msg+="<br>Remaining spend to ₹20000: ₹"+remainingSpend;

}

msg+="<br><br>Monthly spend so far: ₹"+total;

msg+="<br>Annual spend: ₹"+annualTotal;

msg+="<br>Remaining to ₹150000: ₹"+remainingAnnual;

document.getElementById("result").innerHTML=msg;

}

async function saveSpend(){

let amount=document.getElementById("amount").value;

let month=document.getElementById("month").value;

let type=document.getElementById("type").value;

let formData=new URLSearchParams();

formData.append("month",month);

formData.append("type",type);

formData.append("amount",amount);

await fetch(API,{
method:"POST",
body:formData
});

spends.push(Number(amount));
allSpends.push(Number(amount));

calculate();

document.getElementById("amount").value="";

}

document.getElementById("month").addEventListener("change",loadSpends);

loadSpends();

</script>

</body>
</html>
