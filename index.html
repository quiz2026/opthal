<!DOCTYPE html>
<html>

<head>

<title>Amex MRCC Tracker</title>

<style>

body{
font-family:Arial;
max-width:700px;
margin:auto;
padding:40px;
}

select,input{
width:100%;
padding:8px;
margin:6px 0;
}

button{
padding:10px;
width:100%;
background:#2c7be5;
color:white;
border:none;
cursor:pointer;
}

.card{
border:1px solid #ddd;
padding:15px;
margin-top:20px;
border-radius:6px;
}

ul{
padding-left:18px;
}

.result{
font-size:16px;
line-height:1.6;
}

</style>

</head>

<body>

<h2>Amex MRCC Spend Tracker</h2>

<div class="card">

Month

<select id="month">
<option>Jan</option>
<option>Feb</option>
<option>Mar</option>
<option>Apr</option>
<option>May</option>
<option>Jun</option>
<option>Jul</option>
<option>Aug</option>
<option>Sep</option>
<option>Oct</option>
<option>Nov</option>
<option>Dec</option>
</select>

Month Type

<select id="type">
<option value="1500x4">1500 × 4</option>
<option value="20K">20K Month</option>
</select>

Spend Amount

<input id="amount" type="number" placeholder="Enter spend">

<button onclick="saveSpend()">Add Spend</button>

</div>

<div class="card">

<h3>Transactions</h3>

<ul id="txnList"></ul>

</div>

<div class="card result" id="result">

Loading data...

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzNFOCvpmagXsEAXMHwdEE1uW4XJFJRKeYoIQF2h7QvBbT9sncEpXDaWe_S51z9tY0Sig/exec";

let spends=[];
let allSpends=[];
let monthlyTotals={};

async function loadSpends(){

let month=document.getElementById("month").value;

let res=await fetch(API);

let data=await res.json();

spends=[];
allSpends=[];
monthlyTotals={};

let listHTML="";

data.forEach(row=>{

let amt=Number(row.amount);

allSpends.push(amt);

if(!monthlyTotals[row.month]){
monthlyTotals[row.month]=0;
}

monthlyTotals[row.month]+=amt;

if(row.month===month){

spends.push(amt);

listHTML+="<li>₹"+amt+"</li>";

}

});

document.getElementById("txnList").innerHTML=listHTML || "No transactions yet";

calculate();

}

function calculate(){

let type=document.getElementById("type").value;

let total=spends.reduce((a,b)=>a+b,0);

let count1500=spends.filter(x=>x>=1500).length;

let remainingTxn=Math.max(0,4-count1500);

let remainingSpend=Math.max(0,20000-total);

let annualTotal=allSpends.reduce((a,b)=>a+b,0);

let remainingAnnual=Math.max(0,150000-annualTotal);

let twentyKMonths=0;

for(let m in monthlyTotals){

if(monthlyTotals[m]>=20000){
twentyKMonths++;
}

}

let remaining20K=Math.max(0,6-twentyKMonths);

/* Best next spend suggestion */

let nextSpend=0;

if(count1500<4){

nextSpend=1500;

}else{

nextSpend=remainingSpend;

}

let msg="";

msg+="Transactions ≥1500: "+count1500+"/4<br>";

msg+="Remaining ≥1500 transactions allowed: "+remainingTxn+"<br><br>";

if(type==="20K"){

msg+="Remaining spend to ₹20000: ₹"+remainingSpend+"<br>";

msg+="Best next spend suggestion: ₹"+nextSpend+"<br><br>";

}

msg+="Monthly total: ₹"+total+"<br><br>";

msg+="Annual spend: ₹"+annualTotal+"<br>";

msg+="Remaining to ₹150000: ₹"+remainingAnnual+"<br><br>";

msg+="20K months completed: "+twentyKMonths+"/6<br>";

msg+="20K months remaining: "+remaining20K;

document.getElementById("result").innerHTML=msg;

}

async function saveSpend(){

let amount=document.getElementById("amount").value;

let month=document.getElementById("month").value;

let type=document.getElementById("type").value;

let formData=new URLSearchParams();

formData.append("month",month);
formData.append("type",type);
formData.append("amount",amount);

await fetch(API,{
method:"POST",
body:formData
});

document.getElementById("amount").value="";

loadSpends();

}

document.getElementById("month").addEventListener("change",loadSpends);

loadSpends();

</script>

</body>

</html>
