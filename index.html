<!DOCTYPE html>
<html>

<head>
<title>MRCC Tracker</title>
</head>

<body>

<h2>MRCC Spend Tracker</h2>

<form id="spendForm"
action="https://script.google.com/macros/s/AKfycbz9CA9fOY5_tRw6M9TuFz4Lmr7CoSBsIRzz-e4Z7XFtqcmSyo5fsa5whinOyVHH1OrZ7Q/exec"
method="POST"
target="hiddenFrame">

Month
<select name="month">
<option>Jan</option>
<option>Feb</option>
<option>Mar</option>
<option>Apr</option>
<option>May</option>
<option>Jun</option>
<option>Jul</option>
<option>Aug</option>
<option>Sep</option>
<option>Oct</option>
<option>Nov</option>
<option>Dec</option>
</select>

<br><br>

Month Type

<select name="type">
<option value="1500x4">1500x4</option>
<option value="20K">20K Month</option>
</select>

<br><br>

Spend Amount

<input name="amount" type="number">

<br><br>

<button type="submit">Save Spend</button>

</form>

<iframe name="hiddenFrame" style="display:none;"></iframe>

<p id="status">Saved to sheet</p>

</body>

</html>
