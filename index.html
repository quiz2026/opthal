<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NEET-PG Ophthalmology PYQs (2018–2025)</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
.quiz{max-width:950px;margin:auto;background:#fff;padding:20px;border-radius:8px}
.q{margin-top:18px;font-weight:bold}
.topic{font-size:13px;color:#555}
label{display:block;margin:6px 0;cursor:pointer}
.correct{color:green;font-weight:bold}
.wrong{color:red;font-weight:bold}
button{padding:10px 20px;font-size:16px;margin-top:20px}
</style>
</head>
<body>

<div class="quiz">
<h2>👁️ NEET-PG Ophthalmology PYQs (2018–2025)</h2>

<label><b>Enter your name:</b></label>
<input type="text" id="username" placeholder="Your name" style="width:100%;padding:8px;margin-bottom:15px">

<div id="quiz"></div>
<div id="final"></div>
</div>

<script>
const Q = [
{q:"Loss of vision in right halves of both eyes – lesion at:",o:["Left optic tract","Optic chiasma","Right optic nerve","Right visual cortex"],a:0,t:"Neuro-ophthalmology"},
{q:"Photostress test differentiates:",o:["Macular vs optic nerve disease","Lens vs cornea","Cataract vs glaucoma","Retina vs vitreous"],a:0,t:"Neuro-ophthalmology"},
{q:"Argyll Robertson pupil shows:",o:["React no accommodate","Accommodate no react","Neither","Both"],a:1,t:"Neuro-ophthalmology"},
{q:"Infant with photophobia & watering:",o:["Ophthalmia neonatorum","Congenital glaucoma","Cataract","MPS"],a:1,t:"Glaucoma"},
{q:"Drug increasing uveoscleral outflow:",o:["Timolol","Latanoprost","Pilocarpine","Acetazolamide"],a:1,t:"Glaucoma"},
{q:"100-day glaucoma seen in:",o:["CRVO","Eales","CRAO","Steroid"],a:0,t:"Glaucoma"},
{q:"Pseudoexfoliation syndrome presents with:",o:["White flaky material","Corneal ulcer","Hypopyon","Ptosis"],a:0,t:"Glaucoma"},
{q:"Maintains corneal hydration:",o:["Epithelium","Stroma","Endothelium","Descemet"],a:2,t:"Cornea"},
{q:"Feature of fungal ulcer:",o:["Ring abscess","Dendritic ulcer","Reverse hypopyon","Satellite lesions"],a:3,t:"Cornea"},
{q:"Golden ring on iris → next test:",o:["AFP","A1AT","Serum iron","Ceruloplasmin"],a:3,t:"Cornea"},
{q:"Dye & filter for corneal ulcer:",o:["Lissamine green","Fluorescein + green","Fluorescein + cobalt blue","Rose bengal"],a:2,t:"Cornea"},
{q:"Intacs ring used for:",o:["Keratoconus","Cataract","Glaucoma","Ulcer"],a:0,t:"Cornea"},
{q:"Extra eyelashes behind grey line:",o:["Trichiasis","Distichiasis","Madarosis","Tylosis"],a:1,t:"Conjunctiva"},
{q:"Angular conjunctivitis organism:",o:["Moraxella","Adenovirus","Chlamydia","Staph"],a:0,t:"Conjunctiva"},
{q:"Most common ophthalmia neonatorum (developed):",o:["Gonorrhea","Chlamydia","Chemical","Staph"],a:1,t:"Conjunctiva"},
{q:"Acute hemorrhagic conjunctivitis:",o:["EV68","EV69","EV70","EV71"],a:2,t:"Conjunctiva"},
{q:"Most common blow-out fracture site:",o:["Roof","Lateral wall","Medial wall","Floor"],a:3,t:"Orbit"},
{q:"Euthyroid with bilateral proptosis:",o:["Cellulitis","Pseudotumor","Thyroid eye disease","Lymphoma"],a:2,t:"Orbit"},
{q:"Child with painless lateral canthus mass:",o:["Dermoid cyst","Hemangioma","Lacrimal tumor","Epidermoid"],a:0,t:"Orbit"},
{q:"White pupillary reflex + rosettes:",o:["Astrocytoma","Medulloblastoma","Retinoblastoma","Rhabdomyo"],a:2,t:"Retina"},
{q:"Retinoblastoma chemo regimen:",o:["VEB","VEC","VBC","VCE"],a:3,t:"Retina"},
{q:"Roth spots seen in:",o:["Acute leukemia","Uveal melanoma","Lymphoma","All"],a:0,t:"Retina"},
{q:"Shifting fluid sign seen in:",o:["CSR","RD","VH","Macular hole"],a:1,t:"Retina"},
{q:"Painless vision loss in elderly diabetic:",o:["Zonular cataract","Rosette","Sunflower","Immature senile cataract"],a:3,t:"Lens"},
{q:"36 hrs post cataract surgery with pain:",o:["IV steroids","IV antibiotics","Padding","Intravitreal antibiotics"],a:3,t:"Lens"},
{q:"Sunflower cataract seen in:",o:["Wilson","DM","Trauma","Steroid"],a:0,t:"Lens"},
{q:"RA patient with scleral thinning:",o:["Scleromalacia","Staphyloma","Coloboma","Melanoma"],a:0,t:"Sclera"},
{q:"Sympathetic ophthalmia causes:",o:["Anterior uveitis","Pars planitis","Panuveitis","Posterior uveitis"],a:2,t:"Uveitis"},
{q:"Yoke muscle of right LR in dextroversion:",o:["Left SO","Left MR","Left IR","Right SR"],a:1,t:"Squint"},
{q:"False about accommodative esotropia:",o:["Most common","Miotics useful","Associated with myopia","Corrected by specs"],a:2,t:"Squint"},
{q:"Instrument for heterophoria:",o:["Maddox wing","Maddox glass","Maddox rod","Phoropter"],a:2,t:"Optics"},
{q:"Astigmatism shows:",o:["Point focus","Line focus","Circle of least confusion","No focus"],a:1,t:"Optics"},
{q:"Presbyopia correction:",o:["Convex lens","Concave","Cylindrical","Prism"],a:0,t:"Optics"}
];

const quiz = document.getElementById("quiz");
let answers = Array(Q.length).fill(null);

Q.forEach((x,i)=>{
quiz.innerHTML += `
<div class="topic">${x.t}</div>
<div class="q">${i+1}. ${x.q}</div>
${x.o.map((v,j)=>`
<label><input type="radio" name="q${i}" onclick="ans(${i},${j})"> ${v}</label>`).join("")}
<div id="r${i}"></div>`;
});

quiz.innerHTML += `<button onclick="submitQuiz()">Submit Quiz</button>`;

function ans(i,j){
answers[i] = j;
document.getElementById("r"+i).innerHTML =
(j===Q[i].a)
? "<span class='correct'>✔ Correct</span>"
: "<span class='wrong'>✘ Correct: "+Q[i].o[Q[i].a]+"</span>";
}

function submitQuiz(){
const name = document.getElementById("username").value.trim();
if(!name){ alert("Enter your name"); return; }

let score = 0;
answers.forEach((v,i)=>{ if(v===Q[i].a) score++; });

document.getElementById("final").innerHTML =
`<h3>Result</h3>Name: <b>${name}</b><br>Score: <b>${score}/${Q.length}</b>`;

fetch("PASTE_YOUR_WEB_APP_URL_HERE",{
method:"POST",
body:JSON.stringify({name:name,score:score,total:Q.length})
});
}
</script>

</body>
</html>
