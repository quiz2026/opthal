<!DOCTYPE html>
<html>

<head>
<title>MRCC Tracker</title>
</head>

<body>

<h2>MRCC Spend Tracker</h2>

Month
<select id="month">
<option>Jan</option>
<option>Feb</option>
<option>Mar</option>
<option>Apr</option>
<option>May</option>
<option>Jun</option>
<option>Jul</option>
<option>Aug</option>
<option>Sep</option>
<option>Oct</option>
<option>Nov</option>
<option>Dec</option>
</select>

<br><br>

Month Type

<select id="type">
<option value="1500x4">1500x4</option>
<option value="20K">20K Month</option>
</select>

<br><br>

Spend Amount

<input type="number" id="amount">

<br><br>

<button onclick="sendData()">Save Spend</button>

<p id="status"></p>

<script>

function sendData(){

let month=document.getElementById("month").value;
let type=document.getElementById("type").value;
let amount=document.getElementById("amount").value;

let formData=new URLSearchParams();

formData.append("month",month);
formData.append("type",type);
formData.append("amount",amount);

fetch("https://script.google.com/macros/s/AKfycbz9CA9fOY5_tRw6M9TuFz4Lmr7CoSBsIRzz-e4Z7XFtqcmSyo5fsa5whinOyVHH1OrZ7Q/exec",{
method:"POST",
body:formData
})
.then(res=>res.text())
.then(data=>{
document.getElementById("status").innerHTML="Saved";
});

}

</script>

</body>

</html>
